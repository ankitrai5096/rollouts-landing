<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Rollout Admin</title>
<script>try { if (localStorage.getItem("rollout_admin_theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* Light by default; the Dark toggle sets data-theme="dark" on <html> and is remembered. */
:root {
  color-scheme: light;
  --primary: #111827; --primary-dark: #000000; --primary-light: #F3F4F6; --on-primary: #FFFFFF;
  --link: #1D4ED8;
  --bg: #F5F5F5; --surface: #FFFFFF; --surface-2: #FAFAFA; --text: #111827; --sub: #6B7280; --muted: #9CA3AF;
  --border: #E5E7EB; --border-soft: #F0F0F0;
  --green: #047857; --green-bg: #ECFDF5; --red: #B91C1C; --red-bg: #FEF2F2;
  --amber: #B45309; --amber-bg: #FFFBEB; --blue: #1D4ED8; --blue-bg: #EFF6FF; --violet: #6D28D9; --violet-bg: #F5F3FF; --grey-bg: #F3F4F6;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --grid: #EEEEEE;
  --ok: #16A34A; --bad: #DC2626;
  --radius: 4px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --primary: #F3F4F6; --primary-dark: #FFFFFF; --primary-light: #262626; --on-primary: #111111;
  --link: #93C5FD;
  --bg: #0A0A0A; --surface: #161616; --surface-2: #1D1D1D; --text: #F3F4F6; --sub: #A3A3A3; --muted: #737373;
  --border: #2A2A2A; --border-soft: #222222;
  --green: #34D399; --green-bg: #0B2A20; --red: #F87171; --red-bg: #2E1213;
  --amber: #FBBF24; --amber-bg: #2B2008; --blue: #93C5FD; --blue-bg: #13213A; --violet: #C4B5FD; --violet-bg: #231B3A; --grey-bg: #262626;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --grid: #262626;
  --ok: #22C55E; --bad: #EF4444;
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text);
  line-height: 1.5; font-size: 14px; min-height: 100vh; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.muted { color: var(--sub); }
.hidden { display: none !important; }
.link-btn { background: none; border: none; color: var(--link); font-weight: 600; padding: 0; margin-left: 6px; }

/* gate */
#gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); z-index: 50; }
.gate-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px 28px; width: 100%; max-width: 400px; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; }
.brand-mark { width: 30px; height: 30px; border-radius: var(--radius); background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; font-weight: 800; }
.brand-name { font-weight: 800; font-size: 17px; }
.gate-card h1 { margin: 22px 0 4px; font-size: 26px; letter-spacing: -.4px; }
.gate-card p { color: var(--sub); font-size: 13px; margin-bottom: 18px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--sub); }
.input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); outline: none; }
.input:focus { border-color: var(--text); }
.err-msg { color: var(--red); font-size: 12.5px; min-height: 18px; margin-top: 4px; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--sub); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-dark); }
.btn.danger { color: var(--red); border-color: var(--red-bg); background: var(--surface); }
.btn.danger:hover { background: var(--red-bg); border-color: var(--red); }
.btn.danger-solid { background: var(--red); border-color: var(--red); color: #fff; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.block { width: 100%; justify-content: center; padding: 11px; }

/* shell */
#app { display: none; }
.sidebar { position: fixed; inset: 0 auto 0 0; width: 232px; background: var(--surface); border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; z-index: 20; }
.sidebar .brand { padding: 0 6px; }
.side-tag { margin: 6px 6px 18px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.nav a { display: block; padding: 9px 10px; border-radius: var(--radius); color: var(--sub); font-weight: 600; margin-bottom: 2px; }
.nav a:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
.nav a.on { background: var(--primary); color: var(--on-primary); }
.nav a.on:hover { background: var(--primary); color: var(--on-primary); }
.nav .sep { height: 1px; background: var(--border); margin: 12px 6px; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 6px; }
.side-foot b { color: var(--text); font-weight: 600; word-break: break-all; }
.side-foot button { margin-top: 10px; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; font-weight: 600; }
.main { margin-left: 232px; min-height: 100vh; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 18px 28px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 10; }
.topbar h2 { font-size: 19px; letter-spacing: -.2px; }
.topbar .sub { color: var(--sub); font-size: 12.5px; }
.topbar .grow { flex: 1; min-width: 0; }
.menu-btn { display: none; }
.content { padding: 24px 28px 60px; max-width: 1280px; }
@media (max-width: 860px) {
  .sidebar { transform: translateX(-100%); transition: transform .2s; }
  body.nav-open .sidebar { transform: none; }
  .main { margin-left: 0; }
  .menu-btn { display: inline-flex; }
  .topbar { padding: 14px 16px; }
  .content { padding: 16px 16px 60px; }
}

/* cards */
.stack { display: flex; flex-direction: column; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 0; flex-wrap: wrap; }
.panel-title { font-weight: 700; font-size: 15px; }
.panel-sub { color: var(--sub); font-size: 12.5px; }
.panel-body { padding: 14px 18px 18px; }
.section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--sub); margin-bottom: 8px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; }
.kpi .label { font-size: 12.5px; color: var(--sub); font-weight: 600; }
.kpi .val { font-size: 26px; font-weight: 800; letter-spacing: -.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .note { font-size: 12px; color: var(--muted); }

/* toolbar */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--border-soft); }
.toolbar .input { max-width: 300px; padding: 8px 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 6px 11px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 600; color: var(--sub); }
.chip.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 10px 18px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
td { padding: 11px 18px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who .t { min-width: 0; }
.who .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.who .e { color: var(--sub); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.avatar { width: 32px; height: 32px; border-radius: var(--radius); background: var(--grey-bg); color: var(--sub); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.emoji { width: 32px; height: 32px; border-radius: var(--radius); background: var(--grey-bg); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.pill { display: inline-block; padding: 2px 9px; border-radius: var(--radius); font-size: 11.5px; font-weight: 700; white-space: nowrap; background: var(--grey-bg); color: var(--sub); }
.pill.green { background: var(--green-bg); color: var(--green); }
.pill.red { background: var(--red-bg); color: var(--red); }
.pill.amber { background: var(--amber-bg); color: var(--amber); }
.pill.blue { background: var(--blue-bg); color: var(--blue); }
.pill.violet { background: var(--violet-bg); color: var(--violet); }
.empty, .state { padding: 34px 18px; text-align: center; color: var(--sub); }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--border-soft); font-size: 12.5px; color: var(--sub); flex-wrap: wrap; }
.pager .btns { display: flex; gap: 6px; }

/* detail */
.crumbs { font-size: 13px; color: var(--sub); margin-bottom: 14px; }
.crumbs a { font-weight: 600; }
.hero { display: flex; gap: 16px; align-items: center; padding: 18px; flex-wrap: wrap; }
.hero .big-emoji { width: 56px; height: 56px; border-radius: var(--radius); background: var(--grey-bg); display: flex; align-items: center; justify-content: center; font-size: 30px; }
.hero .avatar { width: 56px; height: 56px; font-size: 18px; }
.hero h3 { font-size: 21px; letter-spacing: -.3px; }
.hero .meta { color: var(--sub); font-size: 12.5px; display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 2px; }
.hero .grow { flex: 1; min-width: 200px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); background: var(--surface); border-top: 1px solid var(--border-soft); overflow: hidden; }
.fact { background: var(--surface); padding: 12px 18px; border-right: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); margin: 0 -1px -1px 0; }
.fact .k { font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.fact .v { font-weight: 600; margin-top: 2px; word-break: break-word; }
.tier-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.seg button { border: none; background: var(--surface); padding: 8px 13px; font-weight: 600; font-size: 13px; color: var(--sub); border-right: 1px solid var(--border); }
.seg button:last-child { border-right: none; }
.seg button.on { background: var(--primary); color: var(--on-primary); }
.seg button.cur:not(.on) { color: var(--text); }

/* media */
.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; padding: 14px 18px 18px; }
.tile { position: relative; aspect-ratio: 1; border-radius: var(--radius); overflow: hidden; background: var(--grey-bg); cursor: zoom-in; }
.tile img, .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .badge { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: var(--radius); }
.tile .del { position: absolute; right: 6px; top: 6px; background: rgba(0,0,0,.65); color: #fff; border: none; border-radius: var(--radius); font-size: 11.5px; font-weight: 700; padding: 3px 8px; opacity: 0; transition: opacity .15s; }
.tile:hover .del, .tile:focus-within .del { opacity: 1; }
@media (hover: none) { .tile .del { opacity: 1; } }

/* chart */
.chart-wrap { position: relative; padding: 6px 18px 4px; }
.chart-wrap svg { display: block; width: 100%; height: 280px; overflow: visible; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--sub); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: var(--radius); display: inline-block; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 11px; font-size: 12.5px; min-width: 140px; z-index: 2; }
.tip .d { font-weight: 700; margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 7px; justify-content: space-between; }
.tip .r span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--sub); }
.tip i { width: 10px; height: 3px; border-radius: var(--radius); display: inline-block; }
.tip b { font-variant-numeric: tabular-nums; }

/* modal, lightbox, toasts */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
.modal { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 440px; padding: 22px; border: 1px solid var(--border); }
.modal h4 { font-size: 17px; margin-bottom: 6px; }
.modal p { color: var(--sub); font-size: 13.5px; margin-bottom: 14px; }
.modal .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: flex; align-items: center; justify-content: center; z-index: 70; padding: 16px; }
.lightbox img, .lightbox video { max-width: 100%; max-height: 86vh; border-radius: var(--radius); }
.lightbox .bar { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; }
.lightbox .cap { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #ddd; font-size: 12.5px; }
#toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 80; }
.toast { background: var(--primary); color: var(--on-primary); padding: 10px 14px; border-radius: var(--radius); font-size: 13px; max-width: 360px; }
.toast.err { background: var(--red); color: #fff; }
.picker-list { max-height: 360px; overflow-y: auto; }
.pick-row { display: flex; align-items: center; gap: 10px; padding: 9px 18px; border-bottom: 1px solid var(--border-soft); }
.pick-row .grow { flex: 1; min-width: 0; }
.selected { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 18px; border-top: 1px solid var(--border-soft); min-height: 48px; align-items: center; }
.sel-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); font-size: 12.5px; font-weight: 600; }
.sel-chip button { border: none; background: none; color: var(--sub); font-size: 14px; line-height: 1; padding: 0 4px; }
textarea.input { resize: vertical; min-height: 96px; line-height: 1.45; }
.count { float: right; font-weight: 400; color: var(--muted); }
.phone-preview { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); padding: 12px 14px; }
.phone-preview .app { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
.phone-preview .pt { font-weight: 700; word-break: break-word; }
.phone-preview .pb { color: var(--sub); white-space: pre-wrap; word-break: break-word; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 4px 0 14px; }
.reach { font-size: 13px; color: var(--sub); margin: 12px 0; }
.reach b { color: var(--text); }
.svc-map { padding: 8px 18px 18px; overflow-x: auto; }
.svc-hint { display: none; padding: 0 18px; font-size: 12px; color: var(--muted); }
@media (max-width: 860px) { .svc-hint { display: block; } }
.svc-map svg { display: block; width: 100%; min-width: 720px; height: auto; }
.svc-node rect { fill: var(--surface); stroke-width: 1.5; }
.svc-node text { fill: var(--text); font-size: 13px; font-weight: 700; }
.svc-node text.sub { fill: var(--sub); font-size: 11px; font-weight: 500; }
.svc-node { cursor: pointer; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: var(--radius); flex-shrink: 0; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.na { background: var(--muted); }
.svc-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 18px; border-bottom: 1px solid var(--border-soft); }
.svc-row:last-child { border-bottom: none; }
.svc-row .dot { margin-top: 6px; }
.svc-row .grow { flex: 1; min-width: 0; }
.vitals { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--sub); margin-top: 4px; }
.vitals b { color: var(--text); font-weight: 600; }
.legend-row { display: flex; gap: 16px; font-size: 12.5px; color: var(--sub); align-items: center; flex-wrap: wrap; }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }
.term { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.55; max-height: 560px; overflow: auto; padding: 10px 0; background: var(--surface-2); }
.term .ln { display: flex; gap: 12px; padding: 1px 18px; white-space: pre-wrap; word-break: break-word; }
.term .ln:hover { background: var(--primary-light); }
.term .ts { color: var(--muted); flex-shrink: 0; }
.term .lv { flex-shrink: 0; width: 44px; font-weight: 700; color: var(--sub); }
.term .ln.err .lv, .term .ln.err .msg { color: var(--bad); }
.term .ln.warn .lv { color: var(--amber); }
.term .src { flex-shrink: 0; width: 46px; color: var(--sub); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font-size: 13px; }
.banner.bad { border-color: var(--bad); background: var(--red-bg); }
.banner.warn { border-color: var(--amber); background: var(--amber-bg); }
.banner b { display: block; }
.switch-row { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 10px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
@media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
.env-switch { margin: 0 6px 16px; }
.env-badge { padding: 4px 10px; border-radius: var(--radius); font-size: 11.5px; font-weight: 800; letter-spacing: .06em; white-space: nowrap; }
.env-badge.stage { background: var(--grey-bg); color: var(--text); border: 1px solid var(--border); }
.env-badge.local { background: var(--amber-bg); color: var(--amber); }
.env-badge.prod { background: var(--bad); color: #fff; }
.prod-bar { background: var(--bad); color: #fff; font-weight: 700; font-size: 12.5px; text-align: center; padding: 6px 12px; }
body.is-prod .sidebar { border-right: 3px solid var(--bad); }
.health-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 960px) { .two-col { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="gate">
  <form class="gate-card" id="loginForm" autocomplete="on">
    <div class="brand"><div class="brand-mark">R</div><span class="brand-name">Rollout</span></div>
    <h1 id="gateHeading">Admin</h1>
    <p>Super admin only. <button class="link-btn" data-theme-toggle type="button">Dark</button></p>
    <div class="field"><label>Server</label><div class="chips" id="gateServers"></div></div>
    <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="username" required /></div>
    <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" autocomplete="current-password" required /></div>
    <div class="err-msg" id="loginErr"></div>
    <button class="btn primary block" id="loginBtn" type="submit">Sign in</button>
  </form>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">R</div><span class="brand-name">Rollout</span></div>
    <div class="side-tag">Super admin</div>
    <div class="env-switch chips" id="envSwitch"></div>
    <nav class="nav" id="nav">
      <a href="#/overview" data-sec="overview">Overview</a>
      <a href="#/users" data-sec="users">Users</a>
      <a href="#/rooms" data-sec="rooms">Rooms</a>
      <a href="#/revenue" data-sec="revenue">Revenue</a>
      <a href="#/push" data-sec="push">Push notifications</a>
      <div class="sep"></div>

<script>
// This page lives on the website and talks to whichever backend is picked here. Each backend has its
// own sign-in and its own data, so the two can never be mixed up.
const SERVERS = {
  stage: { label: 'Stage', base: 'https://groupsnap-backend-stage.up.railway.app' },
  production: { label: 'Production', base: 'https://api.rollouts.in' },
};
// Only when the page is opened from this computer, to try it against a local backend.
if (['localhost', '127.0.0.1'].includes(location.hostname)) SERVERS.local = { label: 'Local', base: 'http://localhost:8077' };
const SERVER_KEY = 'rollout_admin_server';
const tokenKey = s => `rollout_admin_token_${s}`;
const emailKey = s => `rollout_admin_email_${s}`;
const lastOkKey = s => `rollout_admin_ok_${s}`;
let SERVER = 'stage';
let TOKEN = '';

/* ── helpers ── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (n === null || n === undefined) ? '—' : Number(n).toLocaleString('en-IN');
const inr = n => '₹' + Number(n || 0).toLocaleString('en-IN');
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const fmtDT = d => d ? new Date(d).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
const dayLabel = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
function ago(d) {
  if (!d) return '—';
  const s = Math.max(0, (Date.now() - new Date(d).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  if (s < 86400 * 30) return `${Math.round(s / 86400)}d ago`;
  return fmtDate(d);
}
const initials = n => (n || '?').split(' ').map(w => w[0] || '').join('').toUpperCase().slice(0, 2) || '?';
const avatar = u => { const src = u && (u.face_crop_uri || u.avatar_url);
  return `<div class="avatar">${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : esc(initials(u && u.name))}</div>`; };
const TIER = { normal: ['Free', ''], large: ['Large', 'blue'], extra_large: ['Extra Large', 'violet'], organised: ['Organised (legacy)', 'blue'] };
// Rooms store an icon name from the app ('suitcase'); older ones an emoji. Names without a
// match show the room's first letter.
const ICONS = { suitcase: '🧳', handshake: '🤝', camera: '📸', cake: '🎂', 'birthday-cake': '🎂', heart: '❤️', party: '🎉', 'party-popper': '🎉',
  music: '🎵', plane: '✈️', airplane: '✈️', beach: '🏖️', 'umbrella-beach': '🏖️', graduation: '🎓', 'graduation-cap': '🎓', trophy: '🏆', ring: '💍',
  gift: '🎁', star: '⭐', sun: '☀️', mountain: '⛰️', utensils: '🍽️', food: '🍽️', briefcase: '💼', building: '🏢', church: '⛪', tent: '⛺',
  baby: '👶', dumbbell: '🏋️', football: '⚽', ball: '⚽', book: '📚', home: '🏠', house: '🏠', flower: '🌸', tree: '🌳', car: '🚗', glass: '🥂', drink: '🥂' };
const icon = (e, name) => /^[\x00-\x7F]*$/.test(e || '') ? (ICONS[(e || '').toLowerCase()] || esc((name || '?').trim().charAt(0).toUpperCase())) : esc(e);
const tierPill = t => { const [l, c] = TIER[t] || [t, '']; return `<span class="pill ${c}">${esc(l)}</span>`; };
const statusPill = s => ({ used: '<span class="pill green">Used</span>', unused: '<span class="pill amber">Unused</span>', refunded: '<span class="pill red">Refunded</span>' }[s] || esc(s));
const product = p => p && p.endsWith('999') ? 'Extra Large · ₹999' : 'Large · ₹499';
function readStore(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } }
function writeStore(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} }

// Bumped on every page change. A page's GET that answers after you have moved on is dropped,
// otherwise a slow page (the API logs take seconds) draws into whichever page is showing now.
// fetch that gives up after `ms`, so a server that never answers shows as unreachable instead of hanging.
function fetchT(url, opts = {}, ms = 45000) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  return fetch(url, { ...opts, signal: ctl.signal }).finally(() => clearTimeout(t));
}
// Click and input handlers a page puts on #content are removed when the next page is drawn, so they
// don't pile up as you move between pages (they used to fire several times after a few rooms).
function listen(root, type, fn) { (root._hs = root._hs || []).push([type, fn]); root.addEventListener(type, fn); }
function clearListeners(root) { (root._hs || []).forEach(([t, f]) => root.removeEventListener(t, f)); root._hs = []; }
let routeSeq = 0;
async function api(path, opts = {}) {
  const seq = routeSeq, isGet = !opts.method || opts.method === 'GET';
  const server = SERVER;
  let res;
  try {
    res = await fetchT(SERVERS[server].base + (path.startsWith('/dashboard') ? '' : '/admin/api') + path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${TOKEN}`, ...(opts.headers || {}) },
    });
  } catch { throw new Error('unreachable'); }
  writeStore(lastOkKey(server), String(Date.now()));
  if (res.status === 401) { signOut(); throw new Error('Signed out'); }
  if ((isGet && seq !== routeSeq) || server !== SERVER) return new Promise(() => {});
  let body = null; try { body = await res.json(); } catch {}
  if (!res.ok) throw new Error((body && body.detail) || `Error ${res.status}`);
  return body;
}
function toast(msg, err = false) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 4500);
}

/* Confirm dialog. `typeToConfirm` makes the admin type a word before the button unlocks. */
function confirmDialog({ title, body, confirm = 'Confirm', danger = false, typeToConfirm = '' }) {
  return new Promise(resolve => {
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h4>${esc(title)}</h4><p>${SERVER === 'production' ? '<b style="color:var(--bad)">This is PRODUCTION. </b>' : ''}${body}</p>
      ${typeToConfirm ? `<div class="field"><label>Type <b>${esc(typeToConfirm)}</b> to confirm</label><input class="input" id="cfIn" autocomplete="off"></div>` : ''}
      <div class="row"><button class="btn" data-a="no" type="button">Cancel</button>
      <button class="btn ${danger ? 'danger-solid' : 'primary'}" data-a="yes" type="button" ${typeToConfirm ? 'disabled' : ''}>${esc(confirm)}</button></div></div>`;
    document.body.appendChild(o);
    const yes = $('[data-a=yes]', o), inp = $('#cfIn', o);
    if (inp) { inp.focus(); inp.addEventListener('input', () => { yes.disabled = inp.value.trim() !== typeToConfirm; }); } else yes.focus();
    const done = v => { o.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', onKey);
    o.addEventListener('click', e => { if (e.target === o || e.target.dataset.a === 'no') done(false); if (e.target.dataset.a === 'yes' && !e.target.disabled) done(true); });
  });
}

function pager(data, onPage) {
  const pages = Math.max(1, Math.ceil(data.total / data.page_size));
  const from = data.total ? (data.page - 1) * data.page_size + 1 : 0, to = Math.min(data.total, data.page * data.page_size);
  const id = 'pg' + Math.random().toString(36).slice(2, 8);
  setTimeout(() => {
    const el = document.getElementById(id); if (!el) return;
    el.addEventListener('click', e => { const p = e.target.dataset.p; if (p) onPage(Number(p)); });
  });
  return `<div class="pager" id="${id}"><span>${fmt(from)}–${fmt(to)} of ${fmt(data.total)}</span><div class="btns">
    <button class="btn sm" data-p="1" ${data.page <= 1 ? 'disabled' : ''} type="button">First</button>
    <button class="btn sm" data-p="${data.page - 1}" ${data.page <= 1 ? 'disabled' : ''} type="button">Previous</button>
    <span style="align-self:center;padding:0 6px">Page ${data.page} of ${pages}</span>
    <button class="btn sm" data-p="${data.page + 1}" ${data.page >= pages ? 'disabled' : ''} type="button">Next</button></div></div>`;
}
function debounce(fn, ms = 300) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const state = { users: { page: 1, q: '', banned: false }, rooms: { page: 1, q: '', tier: '' }, rev: { env: 'live', status: 'all', page: 1, date: '' } };

/* ═══════════════ OVERVIEW ═══════════════ */
async function pageOverview(root) {
  const d = await api('/overview');
  const t = d.totals, td = d.today;
  root.innerHTML = `<div class="stack">
    <div><div class="section-label">All time</div><div class="kpis">
      ${kpi('Users', fmt(t.users))}${kpi('Photos', fmt(t.photos))}${kpi('Videos', fmt(t.videos))}
      ${kpi('Events', fmt(t.events))}${kpi('Paid events', fmt(t.paid_events), 'On Large or Extra Large')}</div></div>
    <div><div class="section-label">Today (India time)</div><div class="kpis">
      ${kpi('New users', fmt(td.users))}${kpi('New events', fmt(td.events))}${kpi('Payments', fmt(td.payments), 'Paid events and upgrades')}${kpi('Photos & videos added', fmt(td.photos))}</div></div>
    <section class="card"><div class="panel-head"><div><div class="panel-title">Last 30 days</div><div class="panel-sub">New users, new events and payments per day</div></div>
      <div class="chips" id="chartView"><button class="chip on" data-v="chart" type="button">Chart</button><button class="chip" data-v="table" type="button">Table</button></div></div>
      <div class="panel-body" style="padding-bottom:6px"><div class="legend">
        <span><i style="background:var(--series-1)"></i>New users</span><span><i style="background:var(--series-2)"></i>New events</span><span><i style="background:var(--series-3)"></i>Payments</span></div></div>
      <div id="chartBox"></div></section></div>`;
  const box = $('#chartBox');
  const draw = v => {
    $$('#chartView .chip').forEach(c => c.classList.toggle('on', c.dataset.v === v));
    if (v === 'table') {
      box.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Day</th><th class="num">New users</th><th class="num">New events</th><th class="num">Payments</th></tr></thead><tbody>
        ${d.daily.slice().reverse().map(r => `<tr><td>${dayLabel(r.date)}</td><td class="num">${fmt(r.users)}</td><td class="num">${fmt(r.events)}</td><td class="num">${fmt(r.payments)}</td></tr>`).join('')}</tbody></table></div>`;
    } else lineChart(box, d.daily, [['users', 'New users', 'var(--series-1)'], ['events', 'New events', 'var(--series-2)'], ['payments', 'Payments', 'var(--series-3)']]);
  };
  $('#chartView').addEventListener('click', e => { if (e.target.dataset.v) draw(e.target.dataset.v); });
  draw('chart');
}
const kpi = (label, val, note = '') => `<div class="card kpi"><div class="label">${label}</div><div class="val">${val}</div>${note ? `<div class="note">${note}</div>` : ''}</div>`;

/* One y-axis (all three are counts per day), 2px lines, crosshair tooltip, direct end labels. */
function lineChart(box, rows, series) {
  box.innerHTML = '<div class="chart-wrap"><svg role="img" aria-label="Line chart of the last 30 days"></svg><div class="tip hidden"></div></div>';
  const wrap = $('.chart-wrap', box), svg = $('svg', box), tip = $('.tip', box);
  const W = wrap.clientWidth - 36, H = 280, m = { l: 34, r: 92, t: 12, b: 26 };
  const iw = Math.max(80, W - m.l - m.r), ih = H - m.t - m.b;
  const max = Math.max(1, ...rows.flatMap(r => series.map(s => r[s[0]])));
  const step = niceStep(max), top = Math.ceil(max / step) * step;
  const x = i => m.l + (rows.length < 2 ? iw / 2 : i * iw / (rows.length - 1));
  const y = v => m.t + ih - (v / top) * ih;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`;
  const every = Math.ceil(rows.length / Math.max(2, Math.floor(iw / 70)));
  rows.forEach((r, i) => { if (i % every === 0 || i === rows.length - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${dayLabel(r.date)}</text>`; });
  // End labels, nudged apart so they never overlap.
  const ends = series.map(s => ({ s, y: y(rows[rows.length - 1][s[0]]) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  const over = ends[ends.length - 1].y - (m.t + ih);
  if (over > 0) ends.forEach(e => { e.y -= over; });
  series.forEach(([k, , c]) => {
    g += `<path d="${rows.map((r, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(r[k]).toFixed(1)}`).join('')}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  ends.forEach(({ s: [k, l, c], y: ly }) => { g += `<text x="${m.l + iw + 8}" y="${ly + 4}" font-size="11.5" fill="var(--text)"><tspan fill="${c}">●</tspan> ${esc(l)} ${fmt(rows[rows.length - 1][k])}</text>`; });
  g += `<line class="xh" y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  g += series.map(([, , c], j) => `<circle class="dot${j}" r="4.5" fill="${c}" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`).join('');
  g += `<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" class="hit"/>`;
  svg.innerHTML = g;
  const hit = $('.hit', svg), xh = $('.xh', svg);
  const move = ev => {
    const pt = svg.getBoundingClientRect(), sx = (ev.clientX - pt.left) * (W / pt.width);
    const i = Math.max(0, Math.min(rows.length - 1, Math.round((sx - m.l) / (iw / Math.max(1, rows.length - 1)))));
    const r = rows[i];
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
    series.forEach(([k], j) => { const c = $(`.dot${j}`, svg); c.setAttribute('cx', x(i)); c.setAttribute('cy', y(r[k])); c.setAttribute('visibility', 'visible'); });
    tip.innerHTML = `<div class="d">${dayLabel(r.date)}</div>${series.map(([k, l, c]) => `<div class="r"><span><i style="background:${c}"></i>${esc(l)}</span><b>${fmt(r[k])}</b></div>`).join('')}`;
    tip.classList.remove('hidden');
    const px = x(i) * (pt.width / W) + 18, tw = tip.offsetWidth;
    tip.style.left = (px + tw + 16 > wrap.clientWidth ? px - tw - 16 : px + 12) + 'px'; tip.style.top = '12px';
  };
  const leave = () => { tip.classList.add('hidden'); xh.setAttribute('visibility', 'hidden'); series.forEach((_, j) => $(`.dot${j}`, svg).setAttribute('visibility', 'hidden')); };
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move); hit.addEventListener('pointerleave', leave);
}
function niceStep(max) { const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return Math.max(1, (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p); }

/* ═══════════════ USERS ═══════════════ */
async function pageUsers(root) {

    $$('#ufilt .chip').forEach(c => c.classList.toggle('on', c === e.target)); load(); });
  const load = async () => {
    const d = await api(`/users?page=${st.page}&q=${encodeURIComponent(st.q)}${st.banned ? '&banned=true' : ''}`);
    $('#cnt').textContent = `${fmt(d.total)} users · newest first`;
    $('#list').innerHTML = d.items.length ? `<div class="table-wrap"><table><thead><tr><th>User</th><th>Sign-in</th><th class="num">Events joined</th><th class="num">Created</th><th>Joined</th><th>Last active</th></tr></thead><tbody>

        <td class="num">${fmt(u.rooms_joined)}</td><td class="num">${fmt(u.rooms_created)}</td><td>${fmtDate(u.created_at)}</td><td>${ago(u.last_active_at)}</td></tr>`).join('')}
      </tbody></table></div>${pager(d, p => { st.page = p; load(); })}` : '<div class="empty">No users match.</div>';

  $('#q').addEventListener('input', debounce(e => { st.q = e.target.value; st.page = 1; load(); }));
  await load();

    ${d.payments.length ? `<section class="card"><div class="panel-head"><div class="panel-title">Payments</div></div><div class="panel-body" style="padding:8px 0 0">${paymentsTable(d.payments.map(p => ({ ...p, user: null })), { hideUser: true })}</div></section>` : ''}
  </div>`;
  $$('tr.click[data-id]', root).forEach(tr => tr.addEventListener('click', () => location.hash = '#/rooms/' + tr.dataset.id));

  const who = esc(u.name || u.email || 'this user');
  $('#uBan')?.addEventListener('click', async () => {
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h4>Ban ${who} from the app?</h4>
      <p>They get a push saying their account is suspended, are signed out on every device within a minute, and can't sign back in. Their rooms and photos stay for everyone else. You can unban them any time.</p>
      <div class="field"><label for="banWhy">Reason (sent to them in the push)</label><input class="input" id="banWhy" maxlength="300" placeholder="e.g. spam, abusive photos"></div>
      <div class="row"><button class="btn" data-a="no" type="button">Cancel</button><button class="btn danger-solid" data-a="yes" type="button">Ban</button></div></div>`;
    document.body.appendChild(o); $('#banWhy', o).focus();
    o.addEventListener('click', async e => {
      if (e.target === o || e.target.dataset.a === 'no') { o.remove(); return; }
      if (e.target.dataset.a !== 'yes') return;
      e.target.disabled = true;
      try { const r = await api(`/users/${id}/ban`, { method: 'POST', body: JSON.stringify({ reason: $('#banWhy', o).value }) });
        o.remove(); toast(`Banned and signed out${r.notified ? ', and told by push' : ' (no push: notifications off on their phone)'}.`); route(); }
      catch (err) { e.target.disabled = false; toast(err.message, true); }
    });
  });
  $('#uUnban')?.addEventListener('click', async () => {
    if (!await confirmDialog({ title: `Unban ${who}?`, confirm: 'Unban', body: 'They can sign in and use the app again. Room blocks set separately stay as they are.' })) return;
    try { await api(`/users/${id}/unban`, { method: 'POST' }); toast('Unbanned.'); route(); } catch (e) { toast(e.message, true); }
  });
  $('#uDelete').addEventListener('click', async () => {
    if (!await confirmDialog({ title: `Delete ${who}'s account?`, danger: true, confirm: 'Delete account', typeToConfirm: 'DELETE',
      body: 'They get a push saying Rollout deleted their account and are signed out within a minute. Removes their account and selfie for good, the same as deleting it from the app. Rooms and photos they shared stay for the other members, without their name. They could sign up again unless banned first.' })) return;
    try { const r = await api('/users/' + id, { method: 'DELETE' }); toast(`Account deleted${r.notified ? ', and told by push' : ' (no push: notifications off on their phone)'}.`); location.hash = '#/users'; } catch (e) { toast(e.message, true); }
  });
}

async function pageRooms(root) {

  $('#mediaKind').addEventListener('click', e => { if (!e.target.dataset.v) return; kind = e.target.dataset.v; page = 1;
    $$('#mediaKind .chip').forEach(ch => ch.classList.toggle('on', ch === e.target)); loadMedia(); });

  // 10 entries at a time; "Show more" adds 10 more, so a busy event's card stays short.
  const ACT_PAGE = 10;
