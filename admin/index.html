  const drawActivity = more => {
    if (!actItems.length) { actBox.innerHTML = '<div class="empty">Nothing yet.</div>'; return; }
    actBox.innerHTML = `<div class="table-wrap"><table><thead><tr><th>When</th><th>Who</th><th>What</th></tr></thead><tbody>${actItems.map(it =>
      `<tr><td style="white-space:nowrap">${fmtDT(it.created_at)}</td><td>${it.actor_role === 'admin' ? '' : esc(it.actor_name || 'Deleted user') + ' '}${roleLabel(it.actor_role)}${it.actor_email ? `<div class="muted" style="font-size:12px">${esc(it.actor_email)}</div>` : ''}</td><td>${describeActivity(it)}${it.target_email ? `<div class="muted" style="font-size:12px">${esc(it.target_email)}</div>` : ''}</td></tr>`).join('')}</tbody></table></div>` +
      (more ? '<div class="pager"><span></span><div class="btns"><button class="btn sm" id="actMore" type="button">Show more</button></div></div>' : '');
    $('#actMore')?.addEventListener('click', loadActivity);
  };
  const loadActivity = async () => {
    const before = actItems.length ? `&before=${encodeURIComponent(actItems[actItems.length - 1].created_at)}` : '';
    try { const r = await api(`/rooms/${id}/activity?limit=${ACT_PAGE}${before}`); actItems = actItems.concat(r.items); drawActivity(r.items.length === ACT_PAGE); }
    catch (e) { actBox.innerHTML = `<div class="empty">Couldn't load the history: ${esc(e.message)}</div>`; }
  };
  loadActivity();
}

function lightbox(p) {
  const o = document.createElement('div'); o.className = 'lightbox';
  o.innerHTML = `${p.is_video ? `<video src="${esc(p.uri)}" controls autoplay playsinline></video>` : `<img src="${esc(p.uri)}" alt="">`}
    <div class="bar"><a class="btn sm" href="${esc(p.uri)}" target="_blank" rel="noopener">Open original</a><button class="btn sm" type="button" data-x>Close</button></div>
    <div class="cap">${esc(p.uploader?.name || 'Unknown')} · ${fmtDT(p.created_at)}</div>`;
  document.body.appendChild(o);
  const close = () => { o.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  o.addEventListener('click', e => { if (e.target === o || e.target.dataset.x !== undefined) close(); });
}

/* ═══════════════ REVENUE ═══════════════ */
// One line of an event's history: "deleted 3 photos", "blocked Sam"…
const TIER_NAME = { normal: 'Free', large: 'Large', extra_large: 'Extra Large', organised: 'Organised' };
function describeActivity(it) {
  const d = it.detail || {}, who = esc(d.name || 'someone');
  switch (it.action) {
    case 'photos_deleted': {
      const bits = [d.photos ? `${d.photos} ${d.photos === 1 ? 'photo' : 'photos'}` : '', d.videos ? `${d.videos} ${d.videos === 1 ? 'video' : 'videos'}` : ''].filter(Boolean);
      return `deleted ${bits.join(' and ') || 'a photo'} added by someone else`;
    }
    case 'member_blocked': return `blocked <b>${who}</b>`;
    case 'member_unblocked': return `unblocked <b>${who}</b>`;
    case 'role_changed': return d.role === 'organiser' ? `made <b>${who}</b> an organiser` : `made <b>${who}</b> a member again`;
    case 'privacy_changed': {
      const parts = [];
      if (d.upload_mode) parts.push(d.upload_mode === 'organisers' ? 'only organisers can add photos' : 'everyone can add photos');
      if (d.view_mode) parts.push(d.view_mode === 'own' ? 'members see only their own photos' : 'members see all photos');
      return `changed privacy: ${parts.join(', ')}`;
    }
    case 'upload_link_created': return 'created a new upload link';
    case 'upload_link_turned_off': return 'turned the upload link off';
    case 'tier_changed': return `moved the event from ${esc(TIER_NAME[d.from] || d.from)} to ${esc(TIER_NAME[d.to] || d.to)}`;
    default: return esc(it.action);
  }
}
const roleLabel = r => r === 'admin' ? '<span class="pill violet">Rollout admin</span>' : r === 'creator' ? '<span class="pill violet">Creator</span>' : '<span class="pill blue">Organiser</span>';

function paymentsTable(items, { hideUser = false, hideRoom = false } = {}) {
  if (!items.length) return '<div class="empty">No payments.</div>';
  return `<div class="table-wrap"><table><thead><tr>${hideUser ? '' : '<th>Paid by</th>'}<th>When</th><th>Product</th><th class="num">Amount</th><th>Status</th>${hideRoom ? '' : '<th>Event</th>'}</tr></thead><tbody>
    ${items.map(p => `<tr>${hideUser ? '' : `<td>${p.user ? `<div class="who"><div class="t"><div class="n"><a href="#/users/${p.user.id}">${esc(p.user.name || 'User')}</a></div><div class="e">${esc(p.user.email || '')}</div></div></div>` : '<span class="muted">Deleted user</span>'}</td>`}
      <td>${fmtDT(p.created_at)}${p.env === 'sandbox' ? ' <span class="pill">Sandbox</span>' : ''}</td><td>${product(p.product_id)}</td><td class="num">${inr(p.amount_inr)}</td>
      <td>${statusPill(p.status)}${p.status === 'used' && p.consumed_at ? `<div class="muted" style="font-size:11.5px">${fmtDate(p.consumed_at)}</div>` : ''}${p.status === 'refunded' ? `<div class="muted" style="font-size:11.5px">${fmtDate(p.refunded_at)}</div>` : ''}</td>
      ${hideRoom ? '' : `<td>${p.room ? `<a href="#/rooms/${p.room.id}">${esc(p.room.name)}</a>` : p.room_id ? '<span class="muted">Deleted event</span>' : '<span class="muted">Not used yet</span>'}</td>`}</tr>`).join('')}
  </tbody></table></div>`;
}

async function pageRevenue(root) {
  const st = state.rev;
  root.innerHTML = '<div class="state">Loading…</div>';
  const d = await api(`/revenue?env=${st.env}`);
  const t = d.totals;
  const envs = [['live', 'Live'], ['sandbox', 'Sandbox'], ['all', 'All']];
  root.innerHTML = `<div class="stack">
    <div class="chips" id="envChips">${envs.map(([v, l]) => `<button class="chip ${st.env === v ? 'on' : ''}" data-v="${v}" type="button">${l}</button>`).join('')}
      <span class="muted" style="align-self:center;font-size:12.5px;margin-left:6px">${st.env === 'sandbox' ? 'Store test purchases. No real money moved.' : st.env === 'live' ? 'Real purchases. Sandbox test buys are left out.' : 'Live and sandbox together.'}${d.env_lookup ? '' : ' RevenueCat key not set here, so sandbox buys can’t be told apart.'}</span></div>
    <div class="kpis">
      ${kpi('Collected', inr(t.collected_inr), 'List price, before store fees')}${kpi('Paid events & upgrades', fmt(t.payments))}
      ${kpi('Today', inr(d.today.collected_inr), `${fmt(d.today.payments)} payments`)}
      ${kpi('Unused', fmt(t.unused), 'Paid, not spent on an event yet')}${kpi('Refunded', fmt(t.refunded), inr(t.refunded_inr))}</div>
    <div class="two-col">
      <section class="card"><div class="panel-head"><div><div class="panel-title">Day by day</div><div class="panel-sub">India time. Pick a day to see its payments.</div></div></div>
        <div class="panel-body" style="padding:8px 0 0">${d.daily.length ? `<div class="table-wrap" style="max-height:360px;overflow-y:auto"><table><thead><tr><th>Day</th><th class="num">Payments</th><th class="num">Collected</th><th class="num">Refunds</th></tr></thead><tbody>
        ${d.daily.map(r => `<tr class="click ${st.date === r.date ? 'sel' : ''}" data-date="${r.date}"><td>${dayLabel(r.date)} ${r.date.slice(0, 4)}${st.date === r.date ? ' <span class="pill violet">Showing</span>' : ''}</td><td class="num">${fmt(r.payments)}</td><td class="num">${inr(r.amount_inr)}</td><td class="num">${fmt(r.refunds)}</td></tr>`).join('')}
        </tbody></table></div>` : '<div class="empty">No payments yet.</div>'}</div></section>
      <section class="card"><div class="panel-head"><div><div class="panel-title">By product</div><div class="panel-sub">${fmt(d.paid_tier_rooms)} events on a paid tier, ${fmt(d.paid_tier_rooms_without_payment)} of them with no payment (set by admin, comped or legacy).</div></div></div>
        <div class="panel-body" style="padding:8px 0 0">${d.by_product.length ? `<table><thead><tr><th>Product</th><th class="num">Sold</th><th class="num">Collected</th></tr></thead><tbody>
        ${d.by_product.map(p => `<tr><td>${esc(p.label)} · ${inr(p.price_inr)}</td><td class="num">${fmt(p.count)}</td><td class="num">${inr(p.amount_inr)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Nothing sold yet.</div>'}</div></section>
    </div>
    <section class="card"><div class="toolbar"><div class="panel-title" style="margin-right:6px">Payments</div>
      <div class="chips" id="stChips">${[['all', 'All'], ['used', 'Used'], ['unused', 'Unused'], ['refunded', 'Refunded']].map(([v, l]) => `<button class="chip ${st.status === v ? 'on' : ''}" data-v="${v}" type="button">${l}</button>`).join('')}</div>
      ${st.date ? `<button class="btn sm" id="clearDate" type="button">${dayLabel(st.date)} ✕</button>` : ''}</div>
      <div id="pays"><div class="state">Loading…</div></div></section></div>`;
  const loadPays = async () => {
    const p = await api(`/payments?page=${st.page}&status=${st.status}&env=${st.env}&date=${st.date}`);
    $('#pays').innerHTML = paymentsTable(p.items) + (p.total ? pager(p, n => { st.page = n; loadPays(); }) : '');
  };
  $('#envChips').addEventListener('click', e => { if (!e.target.dataset.v) return; st.env = e.target.dataset.v; st.page = 1; pageRevenue(root); });
  $('#stChips').addEventListener('click', e => { if (!e.target.dataset.v) return; st.status = e.target.dataset.v; st.page = 1;
    $$('#stChips .chip').forEach(c => c.classList.toggle('on', c === e.target)); loadPays(); });
  $$('tr[data-date]', root).forEach(tr => tr.addEventListener('click', () => { st.date = st.date === tr.dataset.date ? '' : tr.dataset.date; st.page = 1; pageRevenue(root); }));
  $('#clearDate')?.addEventListener('click', () => { st.date = ''; st.page = 1; pageRevenue(root); });
  await loadPays();
}


/* ═══════════════ PUSH ═══════════════ */
const push = { kind: 'rooms', q: '', selected: [], title: '', body: '', openRoom: true };
function pushTo(item) { if (!push.selected.some(x => x.id === item.id)) push.selected.push(item); }

async function pagePush(root) {
  root.innerHTML = `<div class="two-col">
    <section class="card"><div class="panel-head"><div><div class="panel-title">Who gets it</div><div class="panel-sub">Everyone in a room (except blocked people), or particular people.</div></div></div>
      <div class="toolbar"><div class="chips" id="pkKind"><button class="chip ${push.kind === 'rooms' ? 'on' : ''}" data-v="rooms" type="button">Rooms</button><button class="chip ${push.kind === 'users' ? 'on' : ''}" data-v="users" type="button">People</button></div>
        <input class="input" id="pkQ" placeholder="Search" value="${esc(push.q)}"></div>
      <div class="picker-list" id="pkList"><div class="state">Loading…</div></div>
      <div class="selected" id="pkSel"></div></section>
    <section class="card"><div class="panel-head"><div><div class="panel-title">Message</div><div class="panel-sub">Sent right away. It can't be taken back.</div></div></div>
      <div class="panel-body">
        <div class="field"><label for="pTitle">Title <span class="count" id="tCount"></span></label><input class="input" id="pTitle" maxlength="65" value="${esc(push.title)}"></div>
        <div class="field"><label for="pBody">Message <span class="count" id="bCount"></span></label><textarea class="input" id="pBody" maxlength="240">${esc(push.body)}</textarea></div>
        <label class="check"><input type="checkbox" id="pOpen" ${push.openRoom ? 'checked' : ''}> Tapping it opens their room (people picked on their own land on their events list)</label>
        <div class="section-label">Preview</div>
        <div class="phone-preview"><div class="app">Rollout · now</div><div class="pt" id="pvT"></div><div class="pb" id="pvB"></div></div>
        <div class="reach" id="reach">Pick a room or person.</div>
        <button class="btn primary block" id="pSend" type="button" disabled>Send push</button>
      </div></section></div>`;

  const list = $('#pkList'), sel = $('#pkSel');
  const loadList = async () => {
    list.innerHTML = '<div class="state">Loading…</div>';
    const q = encodeURIComponent(push.q);
    const d = await api(push.kind === 'rooms' ? `/rooms?page=1&q=${q}` : `/users?page=1&q=${q}`);
    if (!d.items.length) { list.innerHTML = '<div class="empty">Nothing matches.</div>'; return; }
    list.innerHTML = d.items.map(it => {
      const picked = push.selected.some(x => x.id === it.id);
      const left = push.kind === 'rooms'
        ? `<div class="emoji">${icon(it.emoji, it.name)}</div><div class="grow"><div class="n" style="font-weight:600">${esc(it.name)}</div><div class="muted" style="font-size:12px">${fmt(it.member_count)} ${it.member_count === 1 ? 'person' : 'people'} · ${esc(it.creator?.name || '')} · ${fmtDate(it.created_at)}</div></div>`
        : `${avatar(it)}<div class="grow"><div style="font-weight:600">${esc(it.name || 'User')}</div><div class="muted" style="font-size:12px">${esc(it.email || 'No email')}</div></div>`;
      return `<div class="pick-row">${left}<button class="btn sm" type="button" data-pick="${it.id}" ${picked ? 'disabled' : ''}>${picked ? 'Added' : 'Add'}</button></div>`;
    }).join('') + (d.total > d.items.length ? `<div class="state" style="padding:12px">${fmt(d.total - d.items.length)} more. Search to narrow it down.</div>` : '');
    const byId = Object.fromEntries(d.items.map(i => [i.id, i]));
    $$('[data-pick]', list).forEach(b => b.addEventListener('click', () => {
      const it = byId[b.dataset.pick];
      pushTo({ id: it.id, kind: push.kind, label: push.kind === 'rooms' ? it.name : (it.name || it.email || 'User') });
      b.disabled = true; b.textContent = 'Added'; drawSelected();
    }));
  };

  let reachSeq = 0;
  const updateReach = async () => {
    const seq = ++reachSeq, n = push.selected.length;
    if (!n) { $('#reach').textContent = 'Pick a room or person.'; validate(0); return; }
    $('#reach').textContent = 'Counting…';
    try {
      const r = await api('/push/preview', { method: 'POST', body: JSON.stringify(targets()) });
      if (seq !== reachSeq) return;
      $('#reach').innerHTML = `Reaches <b>${fmt(r.people)}</b> ${r.people === 1 ? 'person' : 'people'}; <b>${fmt(r.with_push)}</b> of them can get a push.` +
        (r.people > r.with_push ? ' The rest have notifications off or haven’t opened the app since signing in.' : '');
      validate(r.with_push);
    } catch (e) { if (seq === reachSeq) $('#reach').textContent = e.message; }
  };
  let reachable = 0;
  const validate = n => { if (n !== undefined) reachable = n;
    $('#pSend').disabled = !(push.title.trim() && push.body.trim() && push.selected.length && reachable); };
  const targets = () => ({ room_ids: push.selected.filter(x => x.kind === 'rooms').map(x => x.id), user_ids: push.selected.filter(x => x.kind === 'users').map(x => x.id) });

  const drawSelected = () => {
    sel.innerHTML = push.selected.length ? push.selected.map(x => `<span class="sel-chip">${x.kind === 'rooms' ? 'Room' : 'Person'}: ${esc(x.label)}<button type="button" data-rm="${x.id}" aria-label="Remove">×</button></span>`).join('')
      : '<span class="muted">Nothing picked yet.</span>';
    $$('[data-rm]', sel).forEach(b => b.addEventListener('click', () => {
      push.selected = push.selected.filter(x => x.id !== b.dataset.rm); drawSelected();
      const add = $(`[data-pick="${b.dataset.rm}"]`, list); if (add) { add.disabled = false; add.textContent = 'Add'; }
    }));
    updateReach();
  };
  const drawPreview = () => {
    $('#pvT').textContent = push.title || 'Title'; $('#pvB').textContent = push.body || 'Your message';
    $('#tCount').textContent = `${push.title.length}/65`; $('#bCount').textContent = `${push.body.length}/240`; validate();
  };

  $('#pkKind').addEventListener('click', e => { if (!e.target.dataset.v) return; push.kind = e.target.dataset.v;
    $$('#pkKind .chip').forEach(c => c.classList.toggle('on', c === e.target)); loadList(); });
  $('#pkQ').addEventListener('input', debounce(e => { push.q = e.target.value; loadList(); }));
  $('#pTitle').addEventListener('input', e => { push.title = e.target.value; drawPreview(); });
  $('#pBody').addEventListener('input', e => { push.body = e.target.value; drawPreview(); });
  $('#pOpen').addEventListener('change', e => { push.openRoom = e.target.checked; });
  $('#pSend').addEventListener('click', async () => {
    const names = push.selected.map(x => esc(x.label)).join(', ');
    const ok = await confirmDialog({ title: `Send to ${fmt(reachable)} ${reachable === 1 ? 'phone' : 'phones'}?`, confirm: 'Send now',
      body: `<b>${esc(push.title)}</b><br>${esc(push.body)}<br><br>To: ${names}` });
    if (!ok) return;
    const btn = $('#pSend'); btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const r = await api('/push', { method: 'POST', body: JSON.stringify({ ...targets(), title: push.title, body: push.body, open_room: push.openRoom }) });
      const parts = [`Delivered to ${r.delivered} ${r.delivered === 1 ? 'phone' : 'phones'}`];
      if (r.failed) parts.push(`${r.failed} failed${r.dead_tokens ? ` (${r.dead_tokens} phone${r.dead_tokens === 1 ? '' : 's'} no longer registered)` : ''}`);
      if (r.unconfirmed) parts.push(`${r.unconfirmed} not confirmed yet`);
      toast(parts.join(' · ') + '.', !r.delivered && !r.unconfirmed);
      push.title = ''; push.body = ''; push.selected = []; pagePush(root);
    } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = 'Send push'; }
  });

  drawPreview(); drawSelected(); await loadList();
}


/* ═══════════════ SERVICES ═══════════════ */
// Only the parts that matter. The rest (push, the worker server) are in the list below the map.
// x/y are box centres.
const SVC_POS = { app: [100, 130], api: [330, 130], database: [570, 40], media: [570, 130], payments: [570, 220], face_worker: [830, 40], video_worker: [830, 130] };
const SVC_EDGES = [['app', 'api'], ['api', 'database'], ['api', 'media'], ['api', 'payments'],
  ['face_worker', 'database'], ['video_worker', 'database'], ['face_worker', 'media'], ['video_worker', 'media']];
const svcTone = st => st === 'ok' ? 'ok' : st === 'unknown' ? 'na' : 'bad';
const svcLabel = st => ({ ok: 'Working', degraded: 'Having problems', down: 'Down', unknown: 'Not checked' }[st] || st);

async function pageServices(root) {
  let selected = 'api', logTimers = [], data = null;
  root.innerHTML = `<div class="stack"><div id="svcTop"></div>
    <section class="card"><div class="panel-head"><div><div class="panel-title">How it connects</div><div class="panel-sub">Click a part to see its logs. A red line touches a part with a problem. Refreshes every 30 seconds.</div></div>
      <div class="legend-row"><span><i class="dot ok"></i>Working</span><span><i class="dot bad"></i>Problem</span><span><i class="dot na"></i>Not checked</span></div></div>
      <div class="svc-hint">Swipe sideways to see the whole map</div><div class="svc-map" id="svcMap"></div></section>
    <div id="svcLogs"></div>
    <section class="card"><div class="panel-head"><div class="panel-title">Every service</div><a href="/admin/ops/" style="font-size:12.5px">Deploys, server graphs and job queue →</a></div><div class="panel-body" style="padding:8px 0 0" id="svcList"></div></section></div>`;

  const showLogs = async () => {
    logTimers.forEach(clearInterval); logTimers = [];
    const sv = data.by[selected], box = $('#svcLogs');
    if (!sv || selected === 'app') { box.innerHTML = ''; return; }
    if (sv.logs) {
      box.innerHTML = `<div id="svcLogHost"></div>`;
      await pageLogs($('#svcLogHost'), sv.logs, { title: `${sv.name} logs`, register: id => { logTimers.push(id); timers.push(id); } });
      return;
    }
    box.innerHTML = `<section class="card"><div class="panel-head"><div><div class="panel-title">${esc(sv.name)}</div><div class="panel-sub">${esc(svcLabel(sv.state))}</div></div></div>
      <div class="panel-body"><div>${esc(sv.detail || '')}</div>
      ${sv.vitals?.length ? `<div class="vitals">${sv.vitals.map(([k, v]) => `<span>${esc(k)}: <b>${esc(v)}</b></span>`).join('')}</div>` : ''}
      <p class="muted" style="margin-top:10px;font-size:12.5px">${esc(sv.name)} doesn't write a log of its own. Failed requests to it show up in <a href="#/logs/errors">All errors</a>.</p></div></section>`;
  };

  const draw = async () => {
    const d = await api('/dashboard/ops/services');
    const by = Object.fromEntries(d.services.map(x => [x.id, x]));
    by.app = { id: 'app', name: 'Mobile app', provider: 'iOS · Android', state: 'ok' };
    data = { by, d };
    const bad = d.services.filter(x => svcTone(x.state) === 'bad');
    const W = 100, H = 40;
    const colour = t => `var(--${t === 'ok' ? 'ok' : t === 'bad' ? 'bad' : 'muted'})`;
    const edges = SVC_EDGES.map(([a, b]) => {
      const [x1, y1] = SVC_POS[a], [x2, y2] = SVC_POS[b];
      const ta = svcTone(by[a]?.state), tb = svcTone(by[b]?.state);
      const t = ta === 'bad' || tb === 'bad' ? 'bad' : ta === 'na' || tb === 'na' ? 'na' : 'ok';
      const sx = x1 + (x2 > x1 ? W : -W), ex = x2 + (x2 > x1 ? -W : W), mx = (sx + ex) / 2;
      return `<path d="M${sx},${y1} C${mx},${y1} ${mx},${y2} ${ex},${y2}" fill="none" stroke="${colour(t)}" stroke-width="2" ${t === 'na' ? 'stroke-dasharray="4 4"' : ''} opacity=".85"/>`;
    }).join('');
    const nodes = Object.entries(SVC_POS).map(([id, [x, y]]) => {
      const sv = by[id]; if (!sv) return '';
      const t = svcTone(sv.state), on = id === selected;
      return `<g class="svc-node" data-id="${id}" tabindex="0" role="button" aria-label="${esc(sv.name)}: ${esc(svcLabel(sv.state))}"><title>${esc(sv.name)}: ${esc(svcLabel(sv.state))}${sv.detail ? ' · ' + esc(sv.detail) : ''}</title>
        <rect x="${x - W}" y="${y - H / 2 - 4}" width="${W * 2}" height="${H + 8}" rx="4" stroke="${colour(t)}" stroke-width="${on ? 3.5 : 1.5}"/>
        <rect x="${x - W}" y="${y - H / 2 - 4}" width="6" height="${H + 8}" fill="${colour(t)}" stroke="none"/>
        <text x="${x - W + 18}" y="${y - 1}">${esc(sv.name)}</text><text class="sub" x="${x - W + 18}" y="${y + 14}">${esc(sv.provider || '')}</text></g>`;
    }).join('');
    const commit = d.config.commit ? ` · commit <span class="mono">${esc(d.config.commit)}</span>` : '';
    $('#svcTop').innerHTML = bad.length ? `<div class="banner bad"><span class="dot bad" style="margin-top:4px"></span><div><b>${bad.length} ${bad.length === 1 ? 'service needs' : 'services need'} attention</b>${bad.map(x => esc(x.name) + ': ' + esc(x.detail)).join(' · ')}</div></div>`
      : `<div class="banner"><span class="dot ok" style="margin-top:4px"></span><div><b>Everything is working</b>Checked ${ago(d.checked_at)}${commit}</div></div>`;
    $('#svcMap').innerHTML = `<svg viewBox="-20 -10 1070 280" role="img" aria-label="Service map">${edges}${nodes}</svg>`;
    $('#svcList').innerHTML = d.services.map(x => `<div class="svc-row"><span class="dot ${svcTone(x.state)}"></span><div class="grow">
          <div><b>${esc(x.name)}</b> <span class="muted" style="font-size:12.5px">${esc(x.provider)}</span> · <span style="color:var(--${svcTone(x.state) === 'ok' ? 'ok' : svcTone(x.state) === 'bad' ? 'bad' : 'sub'});font-weight:600;font-size:12.5px">${esc(svcLabel(x.state))}</span></div>
          <div class="muted" style="font-size:12.5px">${esc(x.detail || x.role)}</div>
          ${x.vitals?.length ? `<div class="vitals">${x.vitals.map(([k, v]) => `<span>${esc(k)}: <b>${esc(v)}</b></span>`).join('')}</div>` : ''}</div></div>`).join('');
    $$('.svc-node', $('#svcMap')).forEach(g => {
      const pick = () => { selected = g.dataset.id; draw().catch(() => {}); showLogs(); };
      g.addEventListener('click', pick);
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
    });
  };
  await draw(); await showLogs();
  timers.push(setInterval(() => { if (!document.hidden) draw().catch(() => {}); }, 30000));
}

/* ═══════════════ LOGS ═══════════════ */
const LOG_TABS = [['errors', 'All errors'], ['api', 'API server'], ['face', 'Face worker'], ['video', 'Video worker']];
const clockTime = d => d ? new Date(d).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) : '';
const lvlClass = l => /ERR|CRIT|FATAL/i.test(l || '') ? 'err' : /WARN/i.test(l || '') ? 'warn' : '';

// opts.title: show it instead of the tab links (used inside the Services page); opts.register: where the
// refresh timers go, so that page can stop them when another part is picked.
async function pageLogs(root, tab, opts = {}) {
  tab = LOG_TABS.some(t => t[0] === tab) ? tab : 'errors';
  const keep = opts.register || (id => timers.push(id));
  let q = '', errorsOnly = false, hours = 24, lines = [];
  root.innerHTML = `<section class="card"><div class="toolbar">${opts.title ? `<div class="panel-title" style="margin-right:6px">${esc(opts.title)}</div>` : `<div class="chips">${LOG_TABS.map(([v, l]) => `<a class="chip ${v === tab ? 'on' : ''}" href="#/logs/${v}" style="text-decoration:none">${l}</a>`).join('')}</div>`}
      <input class="input" id="lq" placeholder="Filter lines">
      ${tab === 'errors' ? `<select class="input" id="lh" style="width:auto">${[[1, 'Last hour'], [24, 'Last 24 hours'], [72, 'Last 3 days'], [168, 'Last 7 days']].map(([v, l]) => `<option value="${v}" ${v === 24 ? 'selected' : ''}>${l}</option>`).join('')}</select>`
        : '<button class="chip" id="lerr" type="button">Errors & warnings only</button>'}
      <span class="muted" id="lcount" style="font-size:12.5px"></span></div>
    <div id="lbody"><div class="state">Loading…</div></div></section>`;
  const body = $('#lbody');
  const render = () => {
    const shown = lines.filter(l => (!errorsOnly || lvlClass(l.level)) && (!q || (l.message || '').toLowerCase().includes(q)));
    $('#lcount').textContent = `${fmt(shown.length)} lines`;
    if (!shown.length) { body.innerHTML = `<div class="empty">${lines.length ? 'No lines match.' : tab === 'errors' ? 'No errors in this window.' : tab === 'video' ? 'No log lines yet. The video worker starts sending logs once the new version is running on the server.' : 'No log lines.'}</div>`; return; }
    const old = body.querySelector('.term'), hadOld = !!old;
    const atBottom = old && old.scrollHeight - old.scrollTop - old.clientHeight < 40;
    body.innerHTML = `<div class="term">${shown.map(l => `<div class="ln ${lvlClass(l.level)}"><span class="ts">${esc(clockTime(l.at))}</span>${tab === 'errors' ? `<span class="src">${esc(l.source)}</span>` : ''}<span class="lv">${esc((l.level || '').slice(0, 5))}</span><span class="msg">${esc(l.message)}</span></div>`).join('')}</div>`;
    const t = body.querySelector('.term'); if (tab !== 'errors' && (atBottom || !hadOld)) t.scrollTop = t.scrollHeight;
  };
  $('#lq').addEventListener('input', debounce(e => { q = e.target.value.toLowerCase(); render(); }, 150));
  $('#lerr')?.addEventListener('click', e => { errorsOnly = !errorsOnly; e.target.classList.toggle('on', errorsOnly); render(); });

  if (tab === 'errors') {
    const load = async () => { const d = await api(`/dashboard/ops/errors/recent?hours=${hours}`); lines = d.items; render(); };
    $('#lh').addEventListener('change', e => { hours = Number(e.target.value); load(); });
    await load(); keep(setInterval(() => { if (!document.hidden) load().catch(() => {}); }, 30000));
  } else if (tab === 'api') {
    const load = async () => {
      try { const d = await api('/dashboard/deployments/logs'); lines = (d.logs || []).map(l => ({ at: l.timestamp, level: l.severity, message: l.message })); }
      catch (e) { body.innerHTML = `<div class="empty">Couldn't read the API logs: ${esc(e.message)}</div>`; return; }
      if (!lines.length) { body.innerHTML = '<div class="empty">No lines came back. Railway log access may not be set up on this server (RAILWAY_API_TOKEN).</div>'; $('#lcount').textContent = ''; return; }
      render();
    };
    await load(); keep(setInterval(() => { if (!document.hidden) load().catch(() => {}); }, 15000));
  } else {
    let lastId = 0;
    const load = async () => {
      const d = await api(`/dashboard/ops/worker/logs?source=${tab}&after_id=${lastId}&limit=${lastId ? 500 : 400}`);
      if (!d.configured) { body.innerHTML = `<div class="empty">${esc(d.error || 'This worker is not sending logs yet.')}</div>`; return; }
      const fresh = d.logs.map(l => ({ id: l.id, at: l.created_at, level: l.level, message: l.message }));
      if (fresh.length) { lastId = fresh[fresh.length - 1].id; lines = lines.concat(fresh).slice(-2000); }
      render();
    };
    await load(); keep(setInterval(() => { if (!document.hidden) load().catch(() => {}); }, 5000));
  }
}

/* ═══════════════ APP VERSION ═══════════════ */
async function pageApp(root) {
  const d = await api('/dashboard/ops/app-config');
  const c = d.config, live = /media\.rollouts\.in/.test(d.public_url || '');
  root.innerHTML = `<div class="stack">
    ${live ? `<div class="banner warn"><div><b>This changes the live app for everyone</b>Every installed copy of Rollout reads this file at <a href="${esc(d.public_url)}" target="_blank" rel="noopener">${esc(d.public_url)}</a>, including from this stage dashboard. Phones see a change within about a minute.</div></div>`
      : `<div class="banner"><div><b>Not the live file</b>This server saves to <span class="mono">${esc(d.public_url || 'unknown')}</span>. Phones read media.rollouts.in/app-config.json, so changes here don't reach them.</div></div>`}
    <div class="kpis">${kpi('Minimum version', esc(c.min_version || '—'), 'Older apps must update')}${kpi('Latest version', esc(c.latest_version || '—'), 'Older apps are asked to update')}
      ${kpi('Maintenance', c.maintenance?.on ? '<span style="color:var(--bad)">On</span>' : '<span style="color:var(--ok)">Off</span>', c.maintenance?.on ? 'App shows the notice' : 'App works normally')}</div>
    <section class="card"><div class="panel-head"><div><div class="panel-title">Versions</div><div class="panel-sub">Use numbers like 1.5.2.</div></div></div>
      <div class="panel-body"><div class="form-grid">
        <div class="field"><label for="minV">Minimum version: below this the app is blocked until it updates</label><input class="input" id="minV" value="${esc(c.min_version)}" placeholder="1.0.0"></div>
        <div class="field"><label for="latV">Latest version: below this the app suggests an update</label><input class="input" id="latV" value="${esc(c.latest_version)}" placeholder="optional"></div>
        <div class="field"><label for="andU">Play Store link</label><input class="input" id="andU" value="${esc(c.android_url)}"></div>
        <div class="field"><label for="iosU">App Store link</label><input class="input" id="iosU" value="${esc(c.ios_url)}"></div>
        <div class="field"><label for="updU">Fallback update link</label><input class="input" id="updU" value="${esc(c.update_url)}"></div></div></div></section>
    <section class="card"><div class="panel-head"><div><div class="panel-title">Maintenance</div><div class="panel-sub">Shows a "we'll be right back" screen instead of the app. Works even when the API is down.</div></div></div>
      <div class="panel-body"><label class="switch-row"><input type="checkbox" id="mOn" ${c.maintenance?.on ? 'checked' : ''}> Maintenance mode on</label>
        <div class="field"><label for="mMsg">Message <span class="count" id="mCount"></span></label><textarea class="input" id="mMsg" maxlength="300" placeholder="We're making Rollout better. Back in a few minutes.">${esc(c.maintenance?.message || '')}</textarea></div></div></section>
    <div><button class="btn primary" id="saveCfg" type="button">Save changes</button> <span class="muted" id="cfgNote" style="font-size:12.5px;margin-left:8px"></span></div></div>`;
  const val = id => $('#' + id).value.trim();
  const form = () => ({ min_version: val('minV'), latest_version: val('latV'), update_url: val('updU'), android_url: val('andU'), ios_url: val('iosU'),
    maintenance: { on: $('#mOn').checked, message: $('#mMsg').value.trim() } });
  const changes = () => {
    const f = form(), out = [];
    if (f.min_version !== (c.min_version || '')) out.push(`Minimum version ${esc(c.min_version || '—')} → <b>${esc(f.min_version || '1.0.0')}</b>`);
    if (f.latest_version !== (c.latest_version || '')) out.push(`Latest version ${esc(c.latest_version || '—')} → <b>${esc(f.latest_version || '—')}</b>`);
    if (f.maintenance.on !== !!c.maintenance?.on) out.push(`Maintenance <b>${f.maintenance.on ? 'ON: the app stops working for everyone' : 'off'}</b>`);
    if (f.maintenance.message !== (c.maintenance?.message || '')) out.push('Maintenance message changed');
    if (f.android_url !== c.android_url || f.ios_url !== c.ios_url || f.update_url !== c.update_url) out.push('Store links changed');
    return out;
  };
  const sync = () => { const n = changes().length; $('#saveCfg').disabled = !n; $('#cfgNote').textContent = n ? `${n} unsaved ${n === 1 ? 'change' : 'changes'}` : 'No changes';
    $('#mCount').textContent = `${$('#mMsg').value.length}/300`; };
  listen(root, 'input', sync); listen(root, 'change', sync); sync();
  $('#saveCfg').addEventListener('click', async () => {
    const list = changes();
    const ok = await confirmDialog({ title: 'Save app settings?', danger: form().maintenance.on && !c.maintenance?.on, confirm: 'Save',
      body: list.join('<br>') + (live ? '<br><br>Every installed app picks this up within about a minute.' : '') });
    if (!ok) return;
    try { await api('/dashboard/ops/app-config', { method: 'PUT', body: JSON.stringify(form()) }); toast('Saved.'); route(); }
    catch (e) { toast(e.message, true); }
  });
}

/* ═══════════════ SHELL ═══════════════ */
const SECTIONS = {
  overview: ['Overview', 'Everything at a glance', pageOverview],
  users: ['Users', 'Everyone who has opened the app', pageUsers],
  rooms: ['Rooms', 'Every event', pageRooms],
  revenue: ['Revenue', 'Paid events and upgrades', pageRevenue],
  push: ['Push notifications', 'Send your own message to rooms or people', pagePush],
  services: ['Services', 'Every running piece, and whether it is working', pageServices],
  logs: ['Logs', 'What every service is saying, newest last', root => pageLogs(root, '')],
  app: ['App version', 'Force updates and maintenance mode for the mobile app', pageApp],
};
function setTitle(t, s) { $('#pageTitle').textContent = t; $('#pageSub').textContent = s || ''; document.title = `${t} — Rollout Admin`; }
let lastRoute = null;
let timers = [];
async function route() {
  routeSeq++;
  timers.forEach(clearInterval); timers = [];
  const [sec, id] = location.hash.replace(/^#\/?/, '').split('/');
  const key = SECTIONS[sec] ? sec : 'overview';
  const [title, sub, fn] = SECTIONS[key];
  $$('#nav a[data-sec]').forEach(a => a.classList.toggle('on', a.dataset.sec === key));
  document.body.classList.remove('nav-open');
  if (lastRoute !== location.hash) window.scrollTo(0, 0);
  lastRoute = location.hash;
  setTitle(title, sub);
  const root = $('#content');
  clearListeners(root);
  root.innerHTML = '<div class="state">Loading…</div>';
  try {
    if (id && key === 'users') await pageUser(root, id);
    else if (id && key === 'rooms') await pageRoom(root, id);
    else if (key === 'logs') await pageLogs(root, id);
    else await fn(root);
  } catch (e) {
    if (!TOKEN) return;
    if (e.message === 'unreachable') {
      const last = Number(readStore(lastOkKey(SERVER)));
      root.innerHTML = `<div class="banner bad"><span class="dot bad" style="margin-top:4px"></span><div><b>${esc(SERVERS[SERVER].label)} server unreachable</b>
        It didn't answer. It may be down or restarting. It last answered ${last ? ago(last) : 'never from this browser'}.
        <div style="margin-top:8px"><button class="btn sm" id="retryBtn" type="button">Try again</button></div></div></div>`;
      $('#retryBtn').addEventListener('click', route);
    } else root.innerHTML = `<div class="card state">Couldn't load this: ${esc(e.message)}</div>`;
  }
}

function showApp() {
  $('#gate').classList.add('hidden'); $('#app').style.display = 'block';
  $('#whoami').textContent = readStore(emailKey(SERVER));
  route();
}
function signOut() {
  TOKEN = ''; writeStore(tokenKey(SERVER), '');
  $('#app').style.display = 'none'; $('#gate').classList.remove('hidden'); $('#password').value = '';
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), err = $('#loginErr'); err.textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await fetchT(SERVERS[SERVER].base + '/admin/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('#email').value, password: $('#password').value }) }, 20000);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      err.textContent = res.status === 401 ? 'Wrong email or password.' : res.status === 429 ? 'Too many tries. Wait 15 minutes.'
        : res.status === 404 ? `${SERVERS[SERVER].label} doesn't have the admin dashboard yet.` : (body.detail || `Server error (${res.status}).`);
      return;
    }
    TOKEN = body.token; writeStore(tokenKey(SERVER), TOKEN); writeStore(emailKey(SERVER), body.email); $('#password').value = '';
    showApp();
  } catch { err.textContent = `The ${SERVERS[SERVER].label} server didn't answer. It may be down or very slow. Try again.`; }
  finally { btn.disabled = false; btn.textContent = 'Sign in'; }
});
$('#logoutBtn').addEventListener('click', signOut);
function applyTheme(dark) {
  if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
  writeStore('rollout_admin_theme', dark ? 'dark' : '');
  $$('[data-theme-toggle]').forEach(b => { b.textContent = dark ? 'Light' : 'Dark'; });
}
$$('[data-theme-toggle]').forEach(b => b.addEventListener('click', () => applyTheme(document.documentElement.dataset.theme !== 'dark')));
applyTheme(document.documentElement.dataset.theme === 'dark');
$('#menuBtn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
$('#refreshBtn').addEventListener('click', route);
window.addEventListener('hashchange', () => { if (TOKEN) route(); });

// ── Which server ──
function renderServerUI() {
  const chips = Object.entries(SERVERS).map(([k, v]) => `<button class="chip ${k === SERVER ? 'on' : ''}" data-server="${k}" type="button">${v.label}</button>`).join('');
  $('#gateServers').innerHTML = chips; $('#envSwitch').innerHTML = chips;
  const prod = SERVER === 'production';
  const badge = $('#envBadge'); badge.textContent = SERVERS[SERVER].label.toUpperCase();
  badge.className = 'env-badge ' + (prod ? 'prod' : SERVER === 'local' ? 'local' : 'stage');
  $('#prodBar').classList.toggle('hidden', !prod);
  $('#gateHeading').textContent = `Sign in to ${SERVERS[SERVER].label}`;
  document.body.classList.toggle('is-prod', prod);
}
function selectServer(s) {
  if (!SERVERS[s] || s === SERVER) return;
  SERVER = s; writeStore(SERVER_KEY, s); TOKEN = readStore(tokenKey(s)); lastRoute = null; routeSeq++;
  timers.forEach(clearInterval); timers = []; renderServerUI();
  if (TOKEN) { showApp(); } else { $('#app').style.display = 'none'; $('#gate').classList.remove('hidden'); $('#loginErr').textContent = ''; }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-server]'); if (b) selectServer(b.dataset.server); });

// Is each backend answering? Needs no sign-in, so it still works when the one you picked is down.
const health = {};
async function pollHealth() {
  await Promise.all(Object.entries(SERVERS).map(async ([k, v]) => {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 7000);
    try { const r = await fetch(v.base + '/', { signal: ctl.signal, cache: 'no-store' }); health[k] = r.ok; }
    catch { health[k] = false; }
    clearTimeout(t);
  }));
  $('#health').innerHTML = Object.entries(SERVERS).map(([k, v]) => `<div class="health-row"><span class="dot ${health[k] ? 'ok' : 'bad'}"></span>${v.label}: ${health[k] ? 'up' : '<b style="color:var(--bad)">not answering</b>'}</div>`).join('');
}
setInterval(() => { if (!document.hidden) pollHealth(); }, 30000);

(async () => {
  const saved = readStore(SERVER_KEY); if (SERVERS[saved]) SERVER = saved;
  renderServerUI(); pollHealth();
  TOKEN = readStore(tokenKey(SERVER));
  if (!TOKEN) return;
  try { await api('/me'); showApp(); }
  catch (e) { if (e.message === 'unreachable') showApp(); /* api() signs out on 401 */ }
})();
</script>
